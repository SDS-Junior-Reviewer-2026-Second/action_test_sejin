name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Build 1
        run: echo "build-1"

  build-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Build 2
        run: echo "build-2"

  build-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Build 3
        run: echo "build-3"

  integration-1:
    needs: [build-1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Integration 1
        run: echo "integration-1"

  integration-2:
    needs: [build-1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

  lint:
    needs: [build-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Lint
        run: echo "lint"

  unit-test:
    needs: [build-3]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test-group: [1, 2, 3]

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Unit test
        run: echo "unit-test group ${{ matrix.test-group }}"

  deploy:
    needs: [integration-1, integration-2, lint, unit-test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "deploy"
